<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
<title>江戸時代 西暦⇔元号 変換</title>
<style>
:root{--blue:#007aff;--blue2:#0062cc;--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#636366;--sep:#d1d1d6;--fill:rgba(118,118,128,.12);--red:#ff3b30;--radius:16px;--cr:11px;--shadow:0 6px 20px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04)}
*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);margin:0 auto;width:100%;max-width:700px;min-height:100vh;padding:max(22px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));overflow-x:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 16px;padding:5px;background:var(--fill);border-radius:14px}.tab-btn{min-width:0;min-height:42px;padding:8px 6px;cursor:pointer;border:0;background:transparent;border-radius:10px;font:inherit;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;transition:transform .08s ease,background-color .15s ease,color .15s ease,box-shadow .15s ease}.tab-btn.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.panel,.tab-panel{background:var(--card);padding:22px;border-radius:var(--radius);box-shadow:var(--shadow)}.tab-panel{display:none}.tab-panel.active{display:block}label{display:block;font-weight:600;color:var(--sub);margin-bottom:7px;font-size:14px}input[type="number"],select{width:100%;min-width:0;height:46px;padding:0 13px;border:1px solid var(--sep);border-radius:var(--cr);font:inherit;font-size:16px;color:var(--text);background:#fff;outline:none;transition:border-color .15s ease,box-shadow .15s ease}input[type="number"]:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.14)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}.input-group{margin-bottom:15px}
.action-row{display:grid;grid-template-columns:1fr 3fr;gap:10px;align-items:stretch;margin-top:8px}.clear-btn{min-height:50px;padding:11px 10px;background:transparent;color:var(--sub);border:1px solid var(--sep);border-radius:13px;cursor:pointer;font:inherit;font-size:15px;font-weight:500;transition:transform .08s ease,background-color .15s ease,border-color .15s ease,color .15s ease}button.action{min-height:50px;padding:11px 18px;background:var(--blue);color:#fff;border:0;border-radius:13px;cursor:pointer;font:inherit;font-size:16px;font-weight:700;width:100%;transition:transform .08s ease,background-color .15s ease}
.result{margin-top:16px;padding:16px;border-radius:14px;text-align:center;font-size:20px;font-weight:700;display:none;border:1px solid transparent}.result.show{display:block}.result.success{background:rgba(0,122,255,.08);color:var(--text);border-color:rgba(0,122,255,.18)}.result.error{background:rgba(255,59,48,.07);color:#c62921;border-color:rgba(255,59,48,.18);font-size:16px}
.era-table{margin-top:16px!important}.era-table h3{text-align:left;color:var(--text);margin:0;font-size:15px}.era-table-header{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;user-select:none;min-height:42px}.toggle-arrow{color:var(--blue);font-size:12px;transition:transform .15s ease}.toggle-arrow.open{transform:rotate(180deg)}.table-wrap{max-height:0;overflow:hidden;transition:max-height .35s ease}.table-wrap.open{max-height:1200px}.table-scroll{max-height:500px;overflow:auto;border:1px solid #e5e5ea;border-radius:12px}.table-scroll::-webkit-scrollbar{width:8px}.table-scroll::-webkit-scrollbar-thumb{background:#c7c7cc;border-radius:4px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 7px;text-align:center;border-bottom:1px solid #e5e5ea}th{background:#f2f2f7;color:var(--sub);font-weight:700;position:sticky;top:0;z-index:1}.era-table table tr:nth-child(even) td,tr.bg-even td{background:#f9f9fb}#hayami-table th:nth-child(1),#hayami-table td:nth-child(1),#hayami-table th:nth-child(2),#hayami-table td:nth-child(2){border-right:1px solid #e5e5ea}.shogun-info{padding:12px 14px;background:#f9f9fb;border-radius:12px;font-size:13px;color:var(--sub);line-height:1.6;text-align:center;border:1px solid #e5e5ea;margin-top:12px}
#hayami-table tr.special-1716{height:120px}#hayami-table tr.special-1716>td{height:120px;padding:0;vertical-align:middle}#hayami-table .special-full,#hayami-table .special-era,#hayami-table .special-shogun{height:120px;box-sizing:border-box}#hayami-table .special-full{display:flex;align-items:center;justify-content:center}#hayami-table .special-era,#hayami-table .special-shogun{display:grid}#hayami-table .special-era{grid-template-rows:1fr 2fr}#hayami-table .special-shogun{grid-template-rows:2fr 1fr}#hayami-table .special-era>div,#hayami-table .special-shogun>div{display:flex;align-items:center;justify-content:center;box-sizing:border-box}#hayami-table .special-era>div:first-child,#hayami-table .special-shogun>div:first-child{border-bottom:1px solid #e5e5ea}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible,.era-table-header:focus-visible{outline:3px solid rgba(0,122,255,.28);outline-offset:2px}button:active{transform:scale(.98)}

/* インフォメーションボタン：PCは作業領域下の右下、スマホは作業領域上の右上 */
.info-footer{display:flex;justify-content:flex-end;align-items:center;order:10;margin-top:12px}
.info-button{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--cr);background:#ffffff;color:#333333;border:1px solid #d1d1d6;padding:0;cursor:pointer;outline:none;font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:400;font-style:normal;line-height:1;-webkit-tap-highlight-color:transparent;transition:transform .08s ease,background-color .15s ease,border-color .15s ease,color .15s ease}
.modal-overlay{position:fixed;inset:0;width:100vw;height:100vh;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;align-items:center;z-index:9999;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease;padding:20px}
.modal-overlay.active{opacity:1;visibility:visible}
.modal-content{position:relative;background:#fff;border-radius:20px;max-width:90vw;max-height:85vh;box-shadow:0 20px 40px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column;transform:scale(.92);transition:transform .25s cubic-bezier(.175,.885,.32,1.275)}
.modal-overlay.active .modal-content{transform:scale(1)}
.modal-close-btn{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(118,118,128,.12);color:var(--sub);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;padding:0;transition:background .15s ease,transform .15s ease;-webkit-tap-highlight-color:transparent}
.modal-close-btn:active{transform:scale(.9);background:rgba(118,118,128,.25)}
.modal-close-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.modal-body{padding:16px;overflow-y:auto;display:flex;justify-content:center;align-items:center}
.modal-body img{max-width:100%;height:auto;border-radius:12px;display:block}
@media(hover:hover) and (pointer:fine){.tab-btn:hover{background:rgba(255,255,255,.72);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}.tab-btn.active:hover{background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.14)}button.action:hover{background:var(--blue2)}.clear-btn:hover{background:rgba(118,118,128,.08);border-color:#c7c7cc;color:var(--text)}.era-table-header:hover h3{color:var(--blue)}.info-button:hover{background:rgba(118,118,128,.08);border-color:#c7c7cc;color:var(--text)}}
@media(max-width:580px){body{padding:max(10px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.info-footer{order:-1;margin-top:0;margin-bottom:8px}.tabs{gap:4px}.tab-btn{font-size:13px;padding:7px 3px}.panel,.tab-panel{padding:14px;border-radius:15px}.row{grid-template-columns:1fr 1fr;gap:8px}.action-row{grid-template-columns:1fr 3fr;gap:8px}.clear-btn,button.action{min-height:48px}.table-scroll{max-height:60vh}th,td{padding:9px 5px;font-size:13px}}
@media(max-width:350px){.tab-btn{font-size:12px}.panel,.tab-panel{padding:11px}.action-row{gap:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== 画面上部UI：PDF編集ツール準拠 ===== */
.info-footer{display:none}
.info-positioner{display:flex;align-items:center;justify-content:flex-end;width:100vw;min-height:44px;margin:-22px 0 14px calc(50% - 50vw);padding:max(4px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 4px max(14px,env(safe-area-inset-left));background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.info-positioner .info-button{flex:0 0 auto;width:40px;height:40px;background:#ffffff;color:#333333;border:1px solid #d1d1d6;}
@media(max-width:600px){
  body{padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .info-positioner{width:100%;min-height:42px;margin:-10px 0 10px;padding:max(3px,env(safe-area-inset-top)) 0 3px;background:transparent;border-bottom:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .info-positioner .info-button{width:40px;height:40px}
}
</style>
</head>
<body>
<div class="info-positioner">
  <button type="button" class="info-button" id="infoButton" aria-label="インフォメーション" aria-haspopup="dialog" aria-controls="infoModal">i</button>
</div>


<!-- タブボタン -->
<div class="tabs">
  <button class="tab-btn" onclick="switchTab('panel-seireki', event)">西暦 → 元号</button>
  <button class="tab-btn" onclick="switchTab('panel-gengo', event)">元号 → 西暦</button>
  <button class="tab-btn active" onclick="switchTab('panel-hayami', event)">早見表</button>
</div>

<!-- タブ1：西暦 → 元号 -->
<div id="panel-seireki" class="tab-panel">
  <div class="input-group">
    <label for="seireki-input">西暦（年）を入力</label>
    <input type="number" id="seireki-input" placeholder="例: 1700" min="1596" max="1868">
  </div>
  <div class="action-row">
    <button type="button" class="clear-btn" onclick="clearSettings()">クリア</button>
    <button class="action" onclick="convertToGengo()">元号に変換する</button>
  </div>
  <div id="result-seireki" class="result"></div>
</div>

<!-- タブ2：元号 → 西暦 -->
<div id="panel-gengo" class="tab-panel">
  <div class="row">
    <div>
      <label for="gengo-select">元号を選択</label>
      <select id="gengo-select"></select>
    </div>
    <div>
      <label for="gengo-year-input">年を入力</label>
      <input type="number" id="gengo-year-input" placeholder="例: 3" min="1">
    </div>
  </div>
  <div class="action-row">
    <button type="button" class="clear-btn" onclick="clearSettings()">クリア</button>
    <button class="action" onclick="convertToSeireki()">西暦に変換する</button>
  </div>
  <div id="result-gengo" class="result"></div>
</div>

<!-- タブ3：早見表 -->
<div id="panel-hayami" class="tab-panel active" style="padding: 20px;">
  <div class="table-scroll">
    <table id="hayami-table">
      <thead>
        <tr>
          <th style="width: 33.333%;">西暦</th>
          <th style="width: 33.333%;">元号</th>
          <th style="width: 33.333%;">将軍</th>
        </tr>
      </thead>
      <tbody>
        <!-- JSで自動生成されます -->
      </tbody>
    </table>
  </div>
</div>

<!-- その他の情報パネル（元号一覧） -->
<div class="panel era-table" style="margin-top: 20px;">
  <div class="era-table-header" onclick="toggleTable()" tabindex="0" role="button" aria-label="江戸時代 元号一覧を開閉">
    <h3>江戸時代 元号一覧（全36元号）</h3>
    <span id="toggle-arrow" class="toggle-arrow">▼</span>
  </div>
  <div id="table-wrap" class="table-wrap">
    <div class="table-scroll" style="margin-bottom: 0;">
      <table>
        <thead><tr><th>No.</th><th>元号</th><th>開始年</th><th>終了年</th><th>年数</th></tr></thead>
        <tbody id="era-table-body"></tbody>
      </table>
    </div>
    <div class="shogun-info">江戸時代（1603〜1868）… 徳川家康が征夷大将軍に任命されてから大政奉還までの約265年間。</div>
  </div>
</div>


<!-- インフォメーションモーダル -->
<div class="modal-overlay" id="infoModal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="インフォメーション">
  <div class="modal-content">
    <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="閉じる">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="modal-body"><img src="pompomboo-tools.png" alt="Pompomboo Tools"></div>
  </div>
</div>
<script>

// ================= インフォメーションモーダル =================
const infoButton = document.getElementById('infoButton');
const infoModal = document.getElementById('infoModal');
const modalCloseBtn = document.getElementById('modalCloseBtn');
let infoLastFocusedElement = null;
function openInfoModal(){
  infoLastFocusedElement = document.activeElement;
  infoModal.classList.add('active');
  infoModal.setAttribute('aria-hidden','false');
  modalCloseBtn.focus();
}
function closeInfoModal(){
  infoModal.classList.remove('active');
  infoModal.setAttribute('aria-hidden','true');
  if(infoLastFocusedElement) infoLastFocusedElement.focus();
}
infoButton.addEventListener('click',openInfoModal);
modalCloseBtn.addEventListener('click',closeInfoModal);
infoModal.addEventListener('click',e=>{if(e.target===infoModal)closeInfoModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&infoModal.classList.contains('active'))closeInfoModal();});
const eras = [
  { name: '慶長', key: 'keicho', startYear: 1596, endYear: 1615, offset: 1595 },
  { name: '元和', key: 'genna', startYear: 1615, endYear: 1624, offset: 1614 },
  { name: '寛永', key: 'kanei', startYear: 1624, endYear: 1644, offset: 1623 },
  { name: '正保', key: 'shoho', startYear: 1644, endYear: 1648, offset: 1643 },
  { name: '慶安', key: 'keian', startYear: 1648, endYear: 1652, offset: 1647 },
  { name: '承応', key: 'joo', startYear: 1652, endYear: 1655, offset: 1651 },
  { name: '明暦', key: 'meireki', startYear: 1655, endYear: 1658, offset: 1654 },
  { name: '万治', key: 'manji', startYear: 1658, endYear: 1661, offset: 1657 },
  { name: '寛文', key: 'kanbun', startYear: 1661, endYear: 1673, offset: 1660 },
  { name: '延宝', key: 'enpo', startYear: 1673, endYear: 1681, offset: 1672 },
  { name: '天和', key: 'tenna', startYear: 1681, endYear: 1684, offset: 1680 },
  { name: '貞享', key: 'jokyo', startYear: 1684, endYear: 1688, offset: 1683 },
  { name: '元禄', key: 'genroku', startYear: 1688, endYear: 1704, offset: 1687 },
  { name: '宝永', key: 'hoei', startYear: 1704, endYear: 1711, offset: 1703 },
  { name: '正徳', key: 'shotoku', startYear: 1711, endYear: 1716, offset: 1710 },
  { name: '享保', key: 'kyoho', startYear: 1716, endYear: 1736, offset: 1715 },
  { name: '元文', key: 'genbun', startYear: 1736, endYear: 1741, offset: 1735 },
  { name: '寛保', key: 'kanpo', startYear: 1741, endYear: 1744, offset: 1740 },
  { name: '延享', key: 'enkyo', startYear: 1744, endYear: 1748, offset: 1743 },
  { name: '寛延', key: 'kanen', startYear: 1748, endYear: 1751, offset: 1747 },
  { name: '宝暦', key: 'horeki', startYear: 1751, endYear: 1764, offset: 1750 },
  { name: '明和', key: 'meiwa', startYear: 1764, endYear: 1772, offset: 1763 },
  { name: '安永', key: 'anei', startYear: 1772, endYear: 1781, offset: 1771 },
  { name: '天明', key: 'tenmei', startYear: 1781, endYear: 1789, offset: 1780 },
  { name: '寛政', key: 'kansei', startYear: 1789, endYear: 1801, offset: 1788 },
  { name: '享和', key: 'kyowa', startYear: 1801, endYear: 1804, offset: 1800 },
  { name: '文化', key: 'bunka', startYear: 1804, endYear: 1818, offset: 1803 },
  { name: '文政', key: 'bunsei', startYear: 1818, endYear: 1830, offset: 1817 },
  { name: '天保', key: 'tenpo', startYear: 1830, endYear: 1844, offset: 1829 },
  { name: '弘化', key: 'koka', startYear: 1844, endYear: 1848, offset: 1843 },
  { name: '嘉永', key: 'kaei', startYear: 1848, endYear: 1854, offset: 1847 },
  { name: '安政', key: 'ansei', startYear: 1854, endYear: 1860, offset: 1853 },
  { name: '万延', key: 'manen', startYear: 1860, endYear: 1861, offset: 1859 },
  { name: '文久', key: 'bunkyu', startYear: 1861, endYear: 1864, offset: 1860 },
  { name: '元治', key: 'genji', startYear: 1864, endYear: 1865, offset: 1863 },
  { name: '慶応', key: 'keio', startYear: 1865, endYear: 1868, offset: 1864 }
];

window.addEventListener('DOMContentLoaded', () => {
  const select = document.getElementById('gengo-select');
  eras.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.key;
    opt.textContent = `${e.name}（${e.startYear}〜）`;
    select.appendChild(opt);
  });
  select.value = 'genroku';

  const tbody = document.getElementById('era-table-body');
  eras.forEach((e, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i + 1}</td><td><strong>${e.name}</strong></td><td>${e.startYear}年</td><td>${e.endYear}年</td><td>${e.endYear - e.startYear + 1}年間</td>`;
    tbody.appendChild(tr);
  });

  generateHayami(); // 初期表示時に早見表を生成
});

document.getElementById('seireki-input').addEventListener('keydown', e => { if (e.key === 'Enter') convertToGengo(); });
document.getElementById('gengo-year-input').addEventListener('keydown', e => { if (e.key === 'Enter') convertToSeireki(); });

function clearSettings() {
  document.getElementById('seireki-input').value = '';
  document.getElementById('result-seireki').className = 'result';
  document.getElementById('gengo-select').value = 'genroku';
  document.getElementById('gengo-year-input').value = '';
  document.getElementById('result-gengo').className = 'result';

  const activePanel = document.querySelector('.tab-panel.active').id;
  if (activePanel === 'panel-seireki') {
    document.getElementById('seireki-input').focus();
  } else if (activePanel === 'panel-gengo') {
    document.getElementById('gengo-year-input').focus();
  }
}

function switchTab(id, e) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  e.target.classList.add('active');

  if (id === 'panel-seireki') {
    document.getElementById('seireki-input').focus();
  } else if (id === 'panel-gengo') {
    document.getElementById('gengo-year-input').focus();
  }
}

document.querySelector('.era-table-header').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTable(); }
});
function toggleTable() { 
  document.getElementById('table-wrap').classList.toggle('open'); 
  document.getElementById('toggle-arrow').classList.toggle('open'); 
}

function formatYear(n) { return n === 1 ? '元年' : n + '年'; }
function showResult(el, html, type) { el.innerHTML = html; el.className = 'result show ' + type; }

function convertToGengo() {
  const input = document.getElementById('seireki-input');
  const resultDiv = document.getElementById('result-seireki');
  const year = parseInt(input.value);
  if (isNaN(year)) { showResult(resultDiv, '西暦を入力してください。', 'error'); return; }

  const matches = eras.filter(e => year >= e.startYear && year <= e.endYear);
  if (matches.length === 0) { showResult(resultDiv, '範囲外です。', 'error'); return; }

  // 該当するすべての元号を配列にして「 / 」で結合する
  const gengoTexts = matches.map(e => `${e.name}${formatYear(year - e.offset)}`);
  const gengoStr = gengoTexts.join(' / ');

  showResult(resultDiv, `西暦 ${year}年 は<br><span style="font-size: 1.2em;">${gengoStr}</span>`, 'success');
}

function convertToSeireki() {
  const era = eras.find(e => e.key === document.getElementById('gengo-select').value);
  const val = parseInt(document.getElementById('gengo-year-input').value);
  const resultDiv = document.getElementById('result-gengo');
  if (isNaN(val) || val < 1) { showResult(resultDiv, '正しい年を入力してください。', 'error'); return; }
  const seireki = val + era.offset;
  if (seireki > era.endYear) { showResult(resultDiv, `${era.name}は最大 ${formatYear(era.endYear - era.offset)} までです。`, 'error'); return; }
  showResult(resultDiv, `${era.name}${formatYear(val)} は<br><span style="font-size: 1.2em;">西暦 ${seireki}年</span>`, 'success');
}

function generateHayami() {
  const tbody = document.querySelector('#hayami-table tbody');
  let html = '';

  for (let i = 0; i < hayamiRows.length; i++) {
    const row = hayamiRows[i];
    const bgClass = row.even ? 'bg-even' : '';
    const is1716 = row.cells.some(cell => cell && cell.text === '1716年');

    if (is1716) {
      html += `<tr class="${bgClass} special-1716">`;
      html += '<td><div class="special-full">1716年</div></td>';
      html += '<td><div class="special-era"><div>正徳6年</div><div>享保元年</div></div></td>';
      html += '<td><div class="special-shogun"><div>⑦家継</div><div>⑧吉宗</div></div></td>';
      html += '</tr>';
      i += 2;
      continue;
    }

    html += `<tr class="${bgClass}">`;
    row.cells.forEach(cell => {
      if (cell === null) return;
      const rowspan = cell.rowspan ? ` rowspan="${cell.rowspan}"` : '';
      html += `<td${rowspan}>${cell.text}</td>`;
    });
    html += '</tr>';
  }
  tbody.innerHTML = html;
}
